[package]
name = "palette"
version = "1.0.1"
edition = "2024"

[[bin]]
name = "bump"
path = "scripts/bump.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rand = "0.9"
arboard = { version = "3", features = ["wayland-data-control"] }
toml = "0.8"
pastel = "0.12"
