name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DIR="palette-${TAG}-${{ matrix.target }}"
          mkdir "$DIR"
          cp "target/${{ matrix.target }}/release/palette" "$DIR/"
          cp -r palettes "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"
          echo "ASSET=${DIR}.tar.gz" >> "$GITHUB_ENV"

      - name: Extract changelog
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract section between this version's heading and the next ## [ heading
          sed -n "/^## \[${TAG}\]/,/^## \[/p" CHANGELOG.md | sed '$d' > release_notes.md
          # Fallback if no section found
          if [ ! -s release_notes.md ]; then
            echo "No changelog entry for ${TAG}" > release_notes.md
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'release_notes.md'
            || '' }}
          files: ${{ env.ASSET }}
